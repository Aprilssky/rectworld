<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RictWorld</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 800px;
            color: #e0e0e0;
            padding: 0 4px;
            flex-wrap: wrap;
            gap: 4px;
        }

        .game-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mode-toggle {
            display: flex;
            background: rgba(255,255,255,0.06);
            border-radius: 6px;
            overflow: hidden;
            font-size: 12px;
        }

        .mode-btn {
            padding: 3px 10px;
            cursor: pointer;
            color: #888;
            transition: all 0.2s;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: inherit;
        }

        .mode-btn.active {
            background: rgba(255,215,0,0.2);
            color: #ffd700;
        }

        .mode-btn:hover { color: #ccc; }

        .user-badge {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 4px;
            background: rgba(255,255,255,0.06);
            cursor: pointer;
            color: #aaa;
            border: none;
            font-family: inherit;
        }

        .user-badge:hover { color: #ffd700; }
        .user-badge.logged-in { color: #4caf50; }

        .game-controls {
            font-size: 12px;
            color: #888;
        }

        .game-controls span {
            margin-left: 12px;
            background: rgba(255,255,255,0.06);
            padding: 2px 8px;
            border-radius: 4px;
        }

        #gameCanvas {
            background: #2d2d44;
            border-radius: 8px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            display: block;
            image-rendering: pixelated;
        }

        .game-footer {
            display: flex;
            justify-content: space-between;
            width: 800px;
            font-size: 12px;
            color: #666;
        }

        .touch-controls {
            display: none;
            gap: 10px;
            justify-content: center;
            padding: 4px 0 8px;
            width: 100%;
            max-width: 800px;
        }

        .touch-btn {
            min-width: 56px;
            height: 44px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
            color: #e0e0e0;
            font-size: 13px;
            font-weight: bold;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 0 10px;
        }

        .touch-btn:active {
            background: rgba(255,215,0,0.2);
            border-color: rgba(255,215,0,0.4);
        }

        .touch-btn .key-hint { font-size: 10px; opacity: 0.5; margin-left: 2px; }

        /* ── Auth Modal ── */

        .auth-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.65);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .auth-overlay.show { display: flex; }

        .auth-modal {
            background: #2d2d44;
            border-radius: 12px;
            padding: 28px 32px;
            width: 340px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }

        .auth-modal h2 {
            color: #ffd700;
            margin-bottom: 16px;
            font-size: 18px;
            text-align: center;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            color: #888;
            font-size: 14px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            background: none;
            border: none;
            font-family: inherit;
        }

        .auth-tab.active { color: #ffd700; border-bottom-color: #ffd700; }
        .auth-tab:hover { color: #ccc; }

        .auth-form { display: none; flex-direction: column; gap: 12px; }
        .auth-form.show { display: flex; }

        .auth-form input {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 10px 12px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .auth-form input:focus { border-color: #ffd700; }
        .auth-form input::placeholder { color: #666; }

        .auth-form button {
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }

        .auth-form button:hover { background: #ffed4a; }
        .auth-form button:disabled { opacity: 0.5; cursor: not-allowed; }

        .auth-error {
            color: #f44336;
            font-size: 12px;
            text-align: center;
            min-height: 18px;
        }

        .auth-success {
            color: #4caf50;
            font-size: 12px;
            text-align: center;
        }

        .auth-close {
            display: block;
            margin: 8px auto 0;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
        }

        .auth-close:hover { color: #ccc; }

        .logout-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.15);
            color: #f44336;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-family: inherit;
        }

        .logout-btn:hover { background: rgba(244,67,54,0.1); }

        .status-msg {
            font-size: 11px;
            color: #888;
            padding: 2px 6px;
        }

        .status-online { color: #4caf50; }
        .status-offline { color: #888; }

        @media (max-width: 820px) {
            .game-header, .game-footer { width: 100%; padding: 0 10px; }
            #gameCanvas { width: 100vw; height: 75vw; max-height: 100vh; border-radius: 0; }
            .game-controls span { display: none; }
            .touch-controls { display: flex; }
            .auth-modal { width: 90%; }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <!-- Header -->
        <div class="game-header">
            <span class="game-title">✦ RictWorld</span>
            <div class="header-right">
                <!-- Mode Toggle -->
                <div class="mode-toggle" id="modeToggle">
                    <button class="mode-btn active" data-mode="offline">📴 离线</button>
                    <button class="mode-btn" data-mode="online">☁️ 在线</button>
                </div>
                <!-- User Button -->
                <button class="user-badge" id="userBtn">🔑 登录</button>
                <div class="status-msg" id="statusMsg">• 离线</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="touch-controls">
            <button class="touch-btn" data-key="E">动作<span class="key-hint">E</span></button>
            <button class="touch-btn" data-key="B">背包<span class="key-hint">B</span></button>
            <button class="touch-btn" data-key="Q">丢弃<span class="key-hint">Q</span></button>
            <button class="touch-btn" data-key="Tab">切换<span class="key-hint">Tab</span></button>
            <button class="touch-btn" data-key=" ">关闭<span class="key-hint">␣</span></button>
        </div>

        <div class="game-footer">
            <span>Web 版本 · 修复版</span>
            <span id="fpsDisplay">FPS: 0</span>
        </div>
    </div>

    <!-- ── Auth Modal ── -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal">
            <h2 id="authTitle">🔐 玩家登录</h2>
            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">登录</button>
                <button class="auth-tab" data-tab="register">注册</button>
            </div>
            <!-- Login Form -->
            <div class="auth-form show" id="loginForm">
                <input type="text" id="loginUser" placeholder="用户名" autocomplete="username">
                <input type="password" id="loginPass" placeholder="密码" autocomplete="current-password">
                <div class="auth-error" id="loginError"></div>
                <button id="loginBtn">登 录</button>
            </div>
            <!-- Register Form -->
            <div class="auth-form" id="registerForm">
                <input type="text" id="regUser" placeholder="用户名 (2-20字符)" autocomplete="off">
                <input type="password" id="regPass" placeholder="密码 (至少4位)" autocomplete="new-password">
                <input type="password" id="regPass2" placeholder="确认密码" autocomplete="new-password">
                <div class="auth-error" id="regError"></div>
                <button id="regBtn">注 册</button>
            </div>
            <button class="auth-close" id="authClose">✕ 关闭</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
